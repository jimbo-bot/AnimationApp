<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Animation App</title>
    <style>
        body {
            margin: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        img {
            width: 80%;
            animation: zoom 3s infinite alternate ease-in-out;
        }

        @keyframes zoom {
            0% { transform: scale(0.8); }
            100% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <img src="salim.png">
</body>
</html>
